
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Get overlay and related elements
    const overlay = document.getElementById('fullscreenOverlay');
    const fullscreenImage = document.getElementById('fullscreenImage');
    const closeBtn = document.getElementById('closeBtn');
    const images = document.querySelectorAll('.photo-container .photo');

    // Add click event to each image
    images.forEach(image => {
      image.addEventListener('click', () => {
        fullscreenImage.src = image.src; // Set overlay image
        overlay.classList.add('active'); // Show overlay
      });
    });

    // Close overlay on close button
    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('active');
    });

    // Close overlay on clicking outside the image
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        overlay.classList.remove('active');
      }
    });

    // Close overlay on pressing 'Esc'
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        overlay.classList.remove('active');
      }
    });
  });
</script>
